<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1F6F66">
<title>AMURA · Comunidad de propietarios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<clipPath id="lt"><rect width="64" height="64" rx="15"/></clipPath>
<g id="bl"><rect width="15" height="27" rx="1.5" fill="#fff"/><rect x="12" width="3" height="27" fill="#E3E7EB"/><path fill="#7FB6D9" d="M3 3h4v4H3zM8 3h4v4H8zM3 12h4v4H3zM8 12h4v4H8zM3 21h4v4H3zM8 21h4v4H8z"/><rect x="-1" y="-2" width="17" height="3" rx="1.5" fill="#CBD2D9"/></g>
<symbol id="logo" viewBox="0 0 64 64"><g clip-path="url(#lt)"><rect width="64" height="64" fill="#BFE6F5"/><circle cx="53" cy="13" r="5" fill="#FFC94D"/><rect y="46" width="64" height="18" fill="#8ED08B"/><use href="#bl" x="6" y="19"/><use href="#bl" x="24.5" y="19"/><use href="#bl" x="43" y="19"/></g></symbol>
</defs></svg>

<section id="login" hidden>
  <form id="form-login">
    <h1><svg class="logo" aria-hidden="true"><use href="#logo"/></svg>AMURA</h1>
    <p>Comunidad de propietarios</p>
    <p class="lead">Introduce el ID de tu vivienda y la contraseña que has recibido para acceder.</p>
    <label>ID de tu vivienda
      <input id="uid" placeholder="p1p1a" autocapitalize="none" autocomplete="username" required>
    </label>
    <label>Contraseña
      <input id="pwd" type="password" autocomplete="current-password" required>
    </label>
    <p id="err" class="error"></p>
    <button class="pri bloque">Entrar</button>
    <button type="button" class="sec bloque" id="btn-manual">Manual de usuario</button>
  </form>
</section>

<section id="app" hidden>
  <header>
    <div class="id"><strong><svg class="logo" aria-hidden="true"><use href="#logo"/></svg>AMURA</strong><span id="quien"></span></div>
    <div class="acc">
      <button class="sec" id="btn-letra" aria-label="Cambiar el tamaño de la letra">A+</button>
      <button class="sec" id="btn-ayuda">Ayuda</button>
      <button class="sec" id="btn-salir">Salir</button>
    </div>
  </header>
  <main id="main"></main>
  <nav>
    <button data-tab="incidencias"><span aria-hidden="true">🛠️</span>Incidencias</button>
    <button data-tab="reuniones"><span aria-hidden="true">📅</span>Reuniones</button>
    <button data-tab="actas"><span aria-hidden="true">📄</span>Actas</button>
    <button data-tab="cuentas"><span aria-hidden="true">💶</span>Cuentas</button>
  </nav>
</section>

<div id="toast" hidden></div>

<dialog id="dlg">
  <h2 id="dlg-t"></h2>
  <form id="dlg-f"></form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
