<!DOCTYPE html>
<html lang="es">
<head>

<body>

<section id="login" hidden>
  <form id="form-login">
    <svg class="hero" viewBox="0 0 400 190" role="img" aria-label="Residencial con piscina y zonas verdes" xmlns="http://www.w3.org/2000/svg">

<linearGradient id="agua" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#27B7D1"/><stop offset="1" stop-color="#86E6EC"/></linearGradient>
<pattern id="vent" width="32" height="20" patternUnits="userSpaceOnUse"><rect x="4" y="3" width="24" height="12" rx="1.5" fill="#7FB6D9"/><rect y="15" width="32" height="2" fill="#fff" opacity=".6"/><rect y="17" width="32" height="3" fill="#CFC6B5"/></pattern>

<rect y="140" width="400" height="50" fill="#8ED08B"/>

<rect x="36" y="146" width="328" height="42" rx="12" fill="#F1E6D2"/>

    <h1>AMURA</h1>
    <p>Comunidad de propietarios</p>
    <p class="lead">Introduce el ID de tu vivienda y la contraseña que has recibido para acceder.</p>
    <label>ID de tu vivienda
      <input id="uid" placeholder="p1p1a" autocapitalize="none" autocomplete="username" required>
    </label>
    <label>Contraseña
      <input id="pwd" type="password" autocomplete="current-password" required>
    </label>
    <p id="err" class="error"></p>
    <button class="pri bloque">Entrar</button>
    <button type="button" class="sec bloque" id="btn-manual">Manual de usuario</button>
  </form>
</section>

<section id="app" hidden>
  <header>
    <div class="id"><strong>AMURA</strong><span id="quien"></span></div>
    <div class="acc">
      <button class="sec" id="btn-letra" aria-label="Cambiar el tamaño de la letra">A+</button>
      <button class="sec" id="btn-ayuda">Ayuda</button>
      <button class="sec" id="btn-salir">Salir</button>
    </div>
  </header>
  <main id="main"></main>
  <nav>
    <button data-tab="incidencias"><span aria-hidden="true">🛠️</span>Incidencias</button>
    <button data-tab="reuniones"><span aria-hidden="true">📅</span>Reuniones</button>
    <button data-tab="actas"><span aria-hidden="true">📄</span>Actas</button>
    <button data-tab="cuentas"><span aria-hidden="true">💶</span>Cuentas</button>
  </nav>
</section>

<div id="toast" hidden></div>

<dialog id="dlg">
  <h2 id="dlg-t"></h2>
  <form id="dlg-f"></form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
