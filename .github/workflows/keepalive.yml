# Mantiene activo el proyecto de Supabase llamando a la función ping() cada 3 días.
# Va en el repositorio en la ruta: .github/workflows/keepalive.yml
name: Mantener Supabase activo
on:
  schedule:
    - cron: '0 9 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a Supabase
        run: |
          curl --fail -s -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/ping" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}'
